<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mic transcription test</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 720px; }
    button { font-size: 1rem; padding: .5rem 1rem; margin-right: .5rem; }
    #status { font-family: monospace; font-size: .85rem; background: #f4f4f4; padding: .5rem; margin: 1rem 0; white-space: pre-wrap; }
    #out p { margin: .4rem 0; }
    .speaker { font-weight: 600; }
    .time { color: #888; font-size: .85rem; }
    .partial { color: #888; font-style: italic; }
    .error { color: #c00; }
  </style>
</head>
<body>
  <h2>Mic → text</h2>
  <button id="start">Start</button>
  <button id="stop" disabled>Stop</button>
  <pre id="status">idle</pre>
  <div id="out"></div>
  <p id="live" class="partial"></p>

<script>
  let ws, ctx, stream, src, proc;
  let chunksSent = 0, bytesSent = 0, peak = 0, silentChunks = 0;
  const out = document.getElementById("out");
  const live = document.getElementById("live");
  const statusEl = document.getElementById("status");
  const startBtn = document.getElementById("start");
  const stopBtn = document.getElementById("stop");

  // Shows what the page knows, so you can see where audio stops on a machine you can't open the console on.
  const info = { mic: "-", sampleRate: "-", socket: "not connected", serverMessages: 0, chunksSent: 0, bytesSent: 0, peak: 0, silentChunks: 0, lastEvent: "-" };
  function updateStatus(event) {
    if (event) info.lastEvent = event;
    info.chunksSent = chunksSent;
    info.bytesSent = bytesSent;
    info.peak = peak.toFixed(3);
    info.silentChunks = silentChunks;
    statusEl.textContent = Object.entries(info).map(([k, v]) => `${k}: ${v}`).join("\n");
  }

  function log(...args) {
    console.log("[mic-test]", ...args);
    updateStatus(args.join(" "));
  }

  function render(msg) {
    info.serverMessages++;
    if (msg.type === "partial") {
      live.textContent = msg.text;
    } else if (msg.type === "final") {
      live.textContent = "";
      const p = document.createElement("p");
      p.innerHTML = `<span class="speaker">${msg.speaker}</span> <span class="time">${msg.start} – ${msg.end}</span>: `;
      p.append(document.createTextNode(msg.text));
      out.append(p);
    } else if (msg.type === "error") {
      const p = document.createElement("p");
      p.className = "error";
      p.textContent = "Error: " + msg.text;
      out.append(p);
    }
    updateStatus("server message: " + msg.type);
  }

  startBtn.onclick = async () => {
    startBtn.disabled = true;
    stopBtn.disabled = false;
    chunksSent = bytesSent = peak = silentChunks = 0;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (err) {
      log("mic access failed:", err.name, err.message);
      startBtn.disabled = false;
      stopBtn.disabled = true;
      return;
    }
    info.mic = stream.getAudioTracks()[0].label || "(no label)";
    // Ask the browser for 16 kHz so no resampling is needed on our side.
    ctx = new AudioContext({ sampleRate: 16000 });
    info.sampleRate = ctx.sampleRate;
    if (ctx.state === "suspended") await ctx.resume();
    src = ctx.createMediaStreamSource(stream);
    // ScriptProcessorNode is deprecated but short and easy to read for a test page.
    proc = ctx.createScriptProcessor(4096, 1, 1);

    ws = new WebSocket(`ws://${location.host}/transcribe/mic`);
    info.socket = "connecting";
    ws.onopen = () => { info.socket = "open"; log("websocket open"); };
    ws.onmessage = (e) => render(JSON.parse(e.data));
    ws.onerror = () => log("websocket error (see console)");
    ws.onclose = (e) => {
      info.socket = `closed (code ${e.code}${e.reason ? ", " + e.reason : ""})`;
      log("websocket closed");
      live.textContent = "";
      startBtn.disabled = false;
    };

    proc.onaudioprocess = (e) => {
      if (ws.readyState !== WebSocket.OPEN) return;
      const input = e.inputBuffer.getChannelData(0);
      const pcm = new Int16Array(input.length);
      let chunkPeak = 0;
      for (let i = 0; i < input.length; i++) {
        const s = Math.max(-1, Math.min(1, input[i]));
        chunkPeak = Math.max(chunkPeak, Math.abs(s));
        pcm[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
      }
      // A peak near 0 means the browser is getting silence from this microphone.
      peak = Math.max(peak, chunkPeak);
      if (chunkPeak < 0.001) silentChunks++;
      ws.send(pcm.buffer);
      chunksSent++;
      bytesSent += pcm.buffer.byteLength;
      if (chunksSent % 20 === 0) updateStatus();
    };
    src.connect(proc);
    proc.connect(ctx.destination);
    log("mic streaming started");
  };

  stopBtn.onclick = () => {
    stopBtn.disabled = true;
    proc.disconnect();
    stream.getTracks().forEach((t) => t.stop());
    ws.send("end");
    log("sent end, waiting for final results");
  };

  updateStatus();
</script>
</body>
</html>
